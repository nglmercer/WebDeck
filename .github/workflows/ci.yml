name: ci

on:
  push:
    branches: [master, v2]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native libraries (GTK tray, ALSA audio, XCB capture)
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libasound2-dev libgtk-3-dev
          libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/contracts/generate.mjs --check
      - name: V2-only migration completion gate
        run: node tools/validation/v2-only.mjs
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../tools/component-check
      - run: npm run check:contracts
      - run: npm run check:components
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run test
      - run: npm run build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Portable tests (live devices and integrations remain opt-in)
        run: cargo test --locked --all-targets

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native build libraries
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libgtk-3-dev
          libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cargo build --locked --bin webdeck
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:acceptance
        working-directory: frontend
      - name: Build an explicitly labelled development portable artifact
        run: cargo run --locked --bin package -- --dev
      - name: Smoke extracted artifact and rehearse upgrade/rollback
        env:
          WEBDECK_PORTABLE_ARTIFACT: ${{ github.workspace }}/dist/WebDeck-2.0.0-alpha.1-linux-x86_64-dev-portable.zip
        run: |
          node tools/validation/portable.mjs "$WEBDECK_PORTABLE_ARTIFACT"
          cargo test --locked --test v2_update portable_archive -- --ignored
