name: ci

on:
  push:
    branches: [master, v2, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native libraries (GTK tray, ALSA audio, XCB capture)
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libasound2-dev libgtk-3-dev
          libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/contracts/generate.mjs --check
      - name: V2-only migration completion gate
        run: node tools/validation/v2-only.mjs
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --example trusted-plugin
      - name: Native trusted plugin and crash isolation
        env:
          WEBDECK_TRUSTED_FIXTURE: target/debug/examples/trusted-plugin
        run: cargo test --locked --test runtime trusted_process_fixture -- --ignored

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../runtime
      - run: npm --prefix ../runtime run check
      - run: npm --prefix ../runtime run build
      - run: git diff --exit-code -- ../runtime/dist
      - run: npm ci --prefix ../tools/component-check
      - run: npm run format:check
      - run: npm run check:contracts
      - run: npm run check:i18n
      - run: npm run check:components
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run test
      - run: npm run build
      - run: npm run check:budget

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Portable tests (live devices and integrations remain opt-in)
        run: cargo test --locked --all-targets
      - run: cargo build --locked --example trusted-plugin
      - name: Native executable plugin fixture
        env:
          WEBDECK_TRUSTED_FIXTURE: target/debug/examples/trusted-plugin.exe
        run: cargo test --locked --test runtime trusted_process_fixture -- --ignored

      - name: Build the real native host
        run: cargo build --locked --bin webdeck
      - name: Chromium acceptance on the native OS
        run: npx playwright install chromium
        working-directory: frontend
      - run: npm run test:acceptance --prefix frontend
      - name: Embedded commands without Node in the product PATH
        run: node tools/validation/runtime.mjs
      - name: Redacted diagnostics on the native OS
        run: node tools/validation/diagnostics.mjs
      - name: Prepare preliminary portable and installer
        run: |
          cargo run --locked --bin package -- --dev
          node tools/release/installers.mjs --dev
      - name: Verify the installed application payload
        shell: bash
        run: |
          artifact=$(find dist -maxdepth 1 \( -name '*-dev.dmg' -o -name '*-dev-setup.exe' \) -print -quit)
          node tools/validation/installer.mjs "$artifact"
      - name: Verify the extracted portable
        shell: bash
        env:
          WEBDECK_PORTABLE_OUTPUT: dist/portable-report.json
        run: |
          artifact=$(find dist -maxdepth 1 -name '*-dev-portable.zip' -print -quit)
          node tools/validation/portable.mjs "$artifact"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preliminary-windows
          path: |
            dist/
            frontend/test-results/
          compression-level: 0

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --example trusted-plugin
      - name: Native executable plugin fixture
        env:
          WEBDECK_TRUSTED_FIXTURE: target/debug/examples/trusted-plugin
        run: cargo test --locked --test runtime trusted_process_fixture -- --ignored

      - name: Build the real native host
        run: cargo build --locked --bin webdeck
      - name: Chromium acceptance on the native OS
        run: npx playwright install chromium
        working-directory: frontend
      - run: npm run test:acceptance --prefix frontend
      - name: Embedded commands without Node in the product PATH
        run: node tools/validation/runtime.mjs
      - name: Redacted diagnostics on the native OS
        run: node tools/validation/diagnostics.mjs
      - name: Prepare preliminary portable and installer
        run: |
          cargo run --locked --bin package -- --dev
          node tools/release/installers.mjs --dev
      - name: Verify the installed application payload
        shell: bash
        run: |
          artifact=$(find dist -maxdepth 1 \( -name '*-dev.dmg' -o -name '*-dev-setup.exe' \) -print -quit)
          node tools/validation/installer.mjs "$artifact"
      - name: Verify the extracted portable
        shell: bash
        env:
          WEBDECK_PORTABLE_OUTPUT: dist/portable-report.json
        run: |
          artifact=$(find dist -maxdepth 1 -name '*-dev-portable.zip' -print -quit)
          node tools/validation/portable.mjs "$artifact"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preliminary-macos
          path: |
            dist/
            frontend/test-results/
          compression-level: 0

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native build libraries
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libgtk-3-dev
          libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cargo build --locked --bin webdeck
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: npm run test:acceptance
        working-directory: frontend
      - run: npm run test:devices --prefix frontend
      - name: Embedded runtime without external JavaScript tools
        run: node tools/validation/runtime.mjs
      - name: Redacted command diagnostic smoke
        run: node tools/validation/diagnostics.mjs
      - name: Build an explicitly labelled development portable artifact
        run: cargo run --locked --bin package -- --dev
      - name: Smoke extracted artifact and rehearse upgrade/rollback
        env:
          WEBDECK_PORTABLE_ARTIFACT: ${{ github.workspace }}/dist/WebDeck-2.0.0-alpha.1-linux-x86_64-dev-portable.zip
        run: |
          node tools/validation/portable.mjs "$WEBDECK_PORTABLE_ARTIFACT"
          cargo test --locked --test v2_update portable_archive -- --ignored

      - name: Prepare and verify the preliminary Debian installer
        shell: bash
        run: |
          node tools/release/installers.mjs --dev
          artifact=$(find dist -maxdepth 1 -name '*-dev.deb' -print -quit)
          node tools/validation/installer.mjs "$artifact"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preliminary-linux-and-browser-reports
          path: |
            dist/
            frontend/test-results/
            frontend/device-report/
          compression-level: 0
