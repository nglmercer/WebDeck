[package]
name = "webdeck"
version = "2.0.0-alpha.1"
edition = "2021"
description = "WebDeck v2 desktop controller (prerelease)"
license = "GPL-3.0-or-later"
default-run = "webdeck"

[[bin]]
name = "webdeck"
path = "src/main.rs"

[[bin]]
name = "console"
path = "src/bin/console.rs"

[[bin]]
name = "update"
path = "src/bin/update.rs"

[[bin]]
name = "package"
path = "src/bin/package.rs"

[[bin]]
name = "webdeck-qr"
path = "src/bin/qr.rs"

[lib]
name = "webdeck"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
libc = "0.2"
getrandom = "0.4.3"
sha2 = "0.10.9"
semver = "1.0.28"
axum = { version = "0.8", features = ["multipart"] }
# tower (ServiceExt/oneshot) is test-only → [dev-dependencies] below.
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls", "webpki-roots"] }
zip = "2"
sysinfo = "0.39.6"
image = "0.25.10"
qrcode = "0.14.1"
minifb = "0.28"
arboard = "3.6.1"
enigo = "0.6.1"
rhai = { version = "1.26.1", features = ["sync", "serde"] }
nvml-wrapper = "0.13.0"
rodio = "0.22.2"
socketioxide = "0.18.7"
rspotify = { version = "0.16.1", features = ["cli"] }
obws = "0.15.0"
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6", "xdg-portal"] }

[target.'cfg(windows)'.dependencies]
# Native tray event loop.
tray-icon = "0.25.1"
tao = "0.37.1"

windows = { version = "0", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# GTK event loop for the native tray.
# ksni (pure-Rust StatusNotifier) instead of libappindicator: native on
# KDE/Wayland, no extra system libraries.
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
tao = "0.37.1"
# Color-picker capture without `screenshots`: it forces dbus/vendored, whose
# libdbus build lacks HAVE_POLL, so any D-Bus call with an fd >= 1024 ends in
# a stack-smashing SIGABRT (select/FD_SET emulation). grim (subprocess) +
# ashpd portal (pure Rust) + raw xcb cover the same backends with no libdbus.
xcb = "1"
display-info = "0.4"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot"] }
# Direct use: one fresh bus connection per portal capture (ashpd's cached
# global connection cannot outlive our throwaway runtimes).
zbus = "5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# `screenshots` is Linux-unsafe (see above); elsewhere its dbus dependency
# (Linux-only) never builds, so it stays.
screenshots = "0.8.10"

[dev-dependencies]
# Router regression tests drive the real route table via `oneshot`.
tower = { version = "0.5", features = ["util"] }

[profile.release]
# Portable packaging is handled by src/bin/package.rs
# (see docs/build-release.md); keep a plain release profile here.
