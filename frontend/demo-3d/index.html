<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebDeck · 3D Showcase</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="brand" aria-hidden="true">
      <svg class="brand-mark" viewBox="0 0 64 64" width="72" height="72">
        <rect x="14" y="6" width="36" height="36" rx="7" transform="rotate(45 32 24)" fill="#ef1a7a" />
        <rect x="14" y="22" width="36" height="36" rx="7" transform="rotate(45 32 40)" fill="none" stroke="#ef1a7a" stroke-width="5" />
      </svg>
      <span class="brand-word">WEBDECK</span>
    </div>

    <header class="hud hud-title">
      <h1>WebDeck <span>3D Showcase</span></h1>
      <p>The live app, rendered on a studio console. Drag to orbit, scroll to zoom.</p>
    </header>

    <nav class="hud hud-angles" aria-label="Camera angles">
      <button type="button" data-testid="angle-front" data-angle="front" class="is-active">Front</button>
      <button type="button" data-testid="angle-hero" data-angle="hero">Hero</button>
      <button type="button" data-testid="angle-side" data-angle="side">Side</button>
      <button type="button" data-testid="angle-top" data-angle="top">Top</button>
      <button type="button" data-testid="angle-rotate" data-rotate aria-pressed="false">Rotate</button>
    </nav>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
